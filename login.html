    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

      window.SUPABASE_URL = "https://ebtawenbhgpbdfjhvbxv.supabase.co";
      window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVidGF3ZW5iaGdwYmRmamh2Ynh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTQ3NjAsImV4cCI6MjEwMjI5MDc2MH0.NaNBdSj4zwyW9koy8HBF5w0Yu20wW60EjCGFQ4xWeas";

  <body data-app-name="Login">
    <div class="app-shell login-shell">
      <div class="content-panel login-panel">
        <div class="login-logo"><img data-brand-logo src="assets/images/logo.png" alt="Fina Estampa" /></div>
        <h1>Acesso ao sistema</h1>
        <p>Entre com sua conta para continuar.</p>
        <form id="loginForm" class="form-grid" style="grid-template-columns:1fr;">
          <div class="form-field">
            <label for="email">E-mail</label>
            <input id="email" class="input" type="email" placeholder="seu@email.com" required />
          </div>
          <div class="form-field">
            <label for="password">Senha</label>
            <input id="password" class="input" type="password" placeholder="********" required />
          </div>
          <button class="btn primary" type="submit" style="margin-top:8px;">Entrar</button>
        </form>
      </div>
      <footer class="app-footer"><p>Trabalhando juntos, entregando resultados.</p><span>FINA ESTAMPA v1.0 • 2026</span></footer>
    </div>
    <div class="toast-stack"></div>
    <script type="module">
      import { signInWithEmail, isSupabaseConfigured } from './js/supabase.js';
      import { showToast } from './js/utils.js';

      document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showToast('Preencha e-mail e senha.', 'error');
          return;
        }

        const configured = await isSupabaseConfigured();
        if (!configured) {
          showToast('Adicione a URL e a chave pública do Supabase antes de entrar.', 'error');
          return;
        }

        const { data, error } = await signInWithEmail(email, password);
        if (error) {
          showToast(error.message || 'Não foi possível entrar.', 'error');
          return;
        }

        if (data.session) {
          showToast('Login realizado com sucesso.', 'success');
          setTimeout(() => {
            window.location.href = 'table.html';
          }, 800);
        }
      });

      lucide.createIcons();
    </script>
  </body>
</html>
