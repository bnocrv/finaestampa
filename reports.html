  <body data-app-name="Relatórios" data-page="reports">
    <div class="app-shell">
      <aside class="app-sidebar">
        <div class="sidebar-header"><div class="brand"><img src="assets/icons/favicon.png" alt="Fina Estampa" /></div></div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="table.html" title="Carregamento" aria-label="Carregamento"><i data-lucide="box"></i></a>
          <a class="nav-item" href="expedicao/index.html" title="Expedição" aria-label="Expedição"><i data-lucide="route"></i></a>
          <a class="nav-item" href="etiquetas/index.html" title="Etiquetas" aria-label="Etiquetas"><i data-lucide="tags"></i></a>
        </nav>
        <div class="sidebar-footer"><button class="nav-item" id="logoutBtn" title="Sair" aria-label="Sair"><i data-lucide="log-out"></i></button></div>
      </aside>
      <main class="app-main">
        <header class="topbar"><div class="topbar-inner"><div class="page-title">Relatórios</div><div class="topbar-actions"><button class="header-btn" id="exportReportBtn"><i data-lucide="download"></i>Exportar CSV</button><div class="header-profile"><div class="avatar" style="width:32px;height:32px;">FE</div><div class="hide-mobile"><strong>Operação</strong></div></div></div></div></header>
        <div class="page-content">
          <div class="page-shell">
            <section class="toolbar">
              <div class="toolbar-group">
                <label class="date-filter">Início <input class="date-input" id="reportStart" type="date" /></label>
                <label class="date-filter">Fim <input class="date-input" id="reportEnd" type="date" /></label>
              </div>
            </section>
            <section class="stats-grid report-stats">
              <article class="stat-card"><div class="label"><span>Total de carregamentos</span><i data-lucide="truck"></i></div><div class="value" id="reportTotalLoads">0</div></article>
              <article class="stat-card"><div class="label"><span>Total de volumes</span><i data-lucide="package"></i></div><div class="value" id="reportTotalVolumes">0</div></article>
              <article class="stat-card"><div class="label"><span>Média por carregamento</span><i data-lucide="activity"></i></div><div class="value" id="reportAverage">0</div></article>
            </section>
            <section class="grid-2">
              <article class="chart-card"><div class="chart-header"><h3>Desempenho por veículo</h3></div><div id="vehiclesReportList"></div></article>
              <article class="chart-card"><div class="chart-header"><h3>Participação dos funcionários</h3></div><div id="employeesReportList"></div></article>
            </section>
          </div>
        </div>
      <footer class="app-footer"><p>Trabalhando juntos, entregando resultados.</p><span>FINA ESTAMPA v1.0 • 2026</span></footer></main>
    </div>
    <div class="toast-stack"></div>
    <script>lucide.createIcons();</script>
