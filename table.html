<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planilha | Carregamento Operacional</title>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icons/favicon.png" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      window.SUPABASE_URL = "https://ebtawenbhgpbdfjhvbxv.supabase.co";
      window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVidGF3ZW5iaGdwYmRmamh2Ynh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTQ3NjAsImV4cCI6MjEwMjI5MDc2MH0.NaNBdSj4zwyW9koy8HBF5w0Yu20wW60EjCGFQ4xWeas";
    </script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/table.js"></script>
  </head>
  <body data-app-name="Planilha" data-page="table">
    <div class="app-shell">
      <aside class="app-sidebar">
        <div class="sidebar-header"><div class="brand"><img src="assets/icons/favicon.png" alt="Fina Estampa" /></div></div>
        <nav class="sidebar-nav">
          <a class="nav-item active" href="/table" title="Carregamento" aria-label="Carregamento"><i data-lucide="box"></i></a>
          <a class="nav-item" href="/expedicao" title="Expedição" aria-label="Expedição"><i data-lucide="route"></i></a>
          <a class="nav-item" href="/etiquetas" title="Etiquetas" aria-label="Etiquetas"><i data-lucide="tags"></i></a>
        </nav>
        <div class="sidebar-footer">
          <button class="nav-item" id="logoutBtn" title="Sair" aria-label="Sair"><i data-lucide="log-out"></i></button>
        </div>
      </aside>
      <main class="app-main">
        <header class="topbar">
          <div class="topbar-inner">
            <div class="page-title">Planilha</div>
            <div class="topbar-actions">
              <div class="search-wrap"><span class="search-icon"><i data-lucide="search"></i></span><input type="search" id="globalSearch" placeholder="Pesquisar" /></div>
              <button class="header-btn" id="addRecordBtn"><i data-lucide="plus"></i>Adicionar registro</button>
              <div class="header-profile"><div class="avatar" style="width:32px;height:32px;">FE</div><div class="hide-mobile"><strong>Operação</strong></div></div>
            </div>
          </div>
        </header>
        <div class="page-content">
          <div class="page-shell">
            <section class="toolbar">
              <div class="toolbar-group">
                <button class="chip" id="newRowBtn"><i data-lucide="plus"></i>Novo registro</button>
                <button class="chip" id="todayBtn"><i data-lucide="calendar-days"></i>Hoje</button>
                <button class="chip" id="filterBtn"><i data-lucide="filter"></i>Filtros</button>
                <button class="chip" id="sortBtn"><i data-lucide="arrow-up-down"></i>Ordenar</button>
                <button class="chip" id="refreshBtn"><i data-lucide="rotate-cw"></i>Atualizar</button>
                <button class="chip" id="exportCsvBtn"><i data-lucide="download"></i>Exportar CSV</button>
              </div>
              <div class="toolbar-group">
                <span class="pill success" id="activeFiltersLabel">Sem filtros</span>
                <button class="chip" id="manageEmployeesBtn" style="opacity:0.6;font-size:12px;" title="Gerenciar Funcionários"><i data-lucide="users" style="width:14px;height:14px;"></i></button>
                <button class="chip" id="manageVehiclesBtn" style="opacity:0.6;font-size:12px;" title="Gerenciar Veículos"><i data-lucide="truck" style="width:14px;height:14px;"></i></button>
              </div>
            </section>
            <section class="filter-bar" id="filterBar"></section>
            <section class="table-card">
              <div class="table-wrap">
                <table class="data-table" id="loadingsTable">
                  <thead>
                    <tr>
                      <th>Data</th>
                      <th>Veículo</th>
                      <th>Volumes</th>
                      <th>Movimentador</th>
                      <th>Carregador</th>
                      <th>Organizador</th>
                      <th>Ações</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody"></tbody>
                </table>
              </div>
              <div class="table-footer">
                <span id="tableCount">0 registros</span>
                <div class="pagination">
                  <button class="page-btn" id="prevPageBtn" aria-label="Página anterior"><i data-lucide="chevron-left"></i></button>
                  <span id="pageInfo">Página 1</span>
                  <button class="page-btn" id="nextPageBtn" aria-label="Próxima página"><i data-lucide="chevron-right"></i></button>
                </div>
              </div>
            </section>
          </div>
        </div>
      <footer class="app-footer"><p>Trabalhando juntos, entregando resultados.</p><span>FINA ESTAMPA v1.0 • 2026</span></footer></main>
    </div>
    <div class="toast-stack"></div>
    
    <!-- Modal Funcionários -->
    <div class="modal" id="employeesModal" style="display:none;">
      <div class="modal-content" style="max-width:500px;">
        <div class="modal-header">
          <h2>Gerenciar Funcionários</h2>
          <button class="modal-close" id="closeEmployeesModal" type="button" aria-label="Fechar"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
          <form id="employeeForm" class="form-grid">
            <div class="form-field">
              <label for="employeeName">Nome</label>
              <input id="employeeName" class="input" type="text" placeholder="Nome do funcionário" required />
            </div>
            <div class="form-field">
              <label for="employeeStatus">Status</label>
              <select id="employeeStatus" class="input">
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>
            <button class="btn primary" type="submit">Salvar</button>
          </form>
          <div id="employeesList" style="margin-top:16px;"></div>
        </div>
      </div>
    </div>
    
    <!-- Modal Veículos -->
    <div class="modal" id="vehiclesModal" style="display:none;">
      <div class="modal-content" style="max-width:500px;">
        <div class="modal-header">
          <h2>Gerenciar Veículos</h2>
          <button class="modal-close" id="closeVehiclesModal" type="button" aria-label="Fechar"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
          <form id="vehicleForm" class="form-grid">
            <div class="form-field">
              <label for="vehiclePlate">Placa</label>
              <input id="vehiclePlate" class="input" type="text" placeholder="ABC-1234" required />
            </div>
            <div class="form-field">
              <label for="vehicleStatus">Status</label>
              <select id="vehicleStatus" class="input">
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>
            <button class="btn primary" type="submit">Salvar</button>
          </form>
          <div id="vehiclesList" style="margin-top:16px;"></div>
        </div>
      </div>
    </div>
    
    <script>lucide.createIcons();</script>
  </body>
</html>
